<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStay Admin Portal - Đăng nhập Hệ thống</title>
  <meta name="description" content="Trang đăng nhập bảo mật dành riêng cho Quản trị viên hệ thống SmartStay Platform (Rovva).">

  <!-- Preload fonts to avoid layout shift -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-body admin-login-page">

  <!-- HEADER -->
  <header class="login-header">
    <div class="login-header-left">
      <a href="#" class="login-logo-svg-text">Rovva</a>
      <span style="margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border-color); font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Admin Portal</span>
    </div>

    <!-- Right Header Actions (Theme Toggle Only) -->
    <div class="login-header-right">
      <!-- Light/Dark Mode Switch -->
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
        <!-- Sun Icon (shown in dark mode) -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <main class="login-hero">
    <div class="login-hero-container">

      <!-- Centered Login Card -->
      <div class="login-card">
        <div class="login-admin-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Khu vực quản trị</span>
        </div>
        <div class="login-card-logo">Rovva</div>
        <h2 class="login-card-title">Cổng Quản Trị Hệ Thống</h2>
        <p class="login-card-subtitle">Đăng nhập bằng tài khoản quản trị viên được cấp quyền.</p>

        <!-- Error Alert Panel -->
        <div id="error-alert" style="display: none; padding: 12px; background-color: var(--danger-bg); border: 1px solid var(--danger); border-radius: var(--radius-sm); color: var(--danger-text); font-size: 0.875rem; margin-bottom: 20px; font-weight: 500;">
          Email hoặc mật khẩu không hợp lệ.
        </div>

        <form id="login-form">
          <!-- Email Input -->
          <div class="form-group">
            <label for="email" class="form-label">Email Quản trị</label>
            <input type="email" id="email" class="form-input" placeholder="admin@gmail.com" required autocomplete="email">
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="password" class="form-label">Mật khẩu</label>
            </div>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Toggle Password Visibility">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me & Forgot Password -->
          <div class="login-card-options">
            <label class="login-remember-me">
              <input type="checkbox" id="remember-me">
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="login-forgot-link">Trợ giúp?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="login-submit-btn">Đăng Nhập Hệ Thống</button>
        </form>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="login-footer login-footer-admin">
    <div class="login-footer-container login-footer-admin-inner">
      <div class="login-footer-admin-text">
        <div>Công ty TNHH Rovva Việt Nam — Cổng thông tin quản trị bảo mật SmartStay Platform</div>
        <div>Copyright © 2026 Rovva. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- DYNAMIC LOGIN LOGIC AND THEME SWITCHER -->
  <script>
    // Redirect Guard: Check if already logged in
    if (localStorage.getItem('admin_logged_in') === 'true') {
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Theme Logic
      const themeToggle = document.getElementById('theme-toggle');
      const htmlEl = document.documentElement;
      const sunIcon = themeToggle.querySelector('.sun-icon');
      const moonIcon = themeToggle.querySelector('.moon-icon');

      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlEl.setAttribute('data-theme', savedTheme);
      updateThemeIcons(savedTheme);

      themeToggle.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        htmlEl.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcons(newTheme);
      });

      function updateThemeIcons(theme) {
        if (theme === 'dark') {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
        } else {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
        }
      }

      // 2. Password Visibility Toggle
      const passwordInput = document.getElementById('password');
      const passwordToggleBtn = document.getElementById('password-toggle');
      const eyeIcon = document.getElementById('eye-icon');

      passwordToggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Toggle eye icon
        if (type === 'text') {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          `;
        }
      });

      // 3. Login Validation Logic
      const loginForm = document.getElementById('login-form');
      const errorAlert = document.getElementById('error-alert');
      const emailInput = document.getElementById('email');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        // Custom validation strictly for admin@gmail.com and password 123
        if (email === 'admin@gmail.com' && password === '123') {
          errorAlert.style.display = 'none';
          
          // Save credentials in LocalStorage
          localStorage.setItem('admin_logged_in', 'true');
          localStorage.setItem('admin_email', 'admin@gmail.com');
          localStorage.setItem('admin_name', 'Nguyễn Admin');
          localStorage.setItem('admin_role', 'Super Admin');
          localStorage.setItem('show_welcome_toast', 'true');
          
          // Success alert and redirect
          alert(`Đăng nhập thành công! Chào mừng Nguyễn Admin quay trở lại.`);
          window.location.href = 'index.html';
        } else {
          // Show error message
          errorAlert.textContent = 'Email hoặc mật khẩu quản trị hệ thống không chính xác!';
          errorAlert.style.display = 'block';
          
          // Reset password field
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    });
  </script>
</body>

</html>
