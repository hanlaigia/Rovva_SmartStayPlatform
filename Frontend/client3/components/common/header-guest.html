<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Rovva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        body{
            margin:0;
            font-family:'Inter',sans-serif;
        }

        .rovva-navbar{
            height:84px;
            background:#fff;
            box-shadow:0 4px 4px rgba(0,0,0,.25);
        }

        .navbar-brand img{
            width:144px;
            height:46px;
            object-fit:contain;
        }

        .nav-link{
            color:#0F294D !important;
            font-size:16px;
            font-weight:700;
            line-height:28px;
            padding:28px 20px !important;
        }

        .dropdown-toggle::after{
            margin-left:10px;
        }

        .auth-link{
            color:#0F294D;
            font-size:16px;
            font-weight:700;
            text-decoration:none;
            padding:28px 20px;
        }

        .auth-link:hover,
        .nav-link:hover{
            color:#2784F0 !important;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg rovva-navbar">
    <div class="container-fluid px-4">

        <a class="navbar-brand me-5" href="#">
            <img src="../Pictures/Logo.jpg" alt="Rovva Logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarRovva">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarRovva">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">Trang chủ</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Ưu đãi
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Khuyến mãi</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Hỗ trợ
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">FAQ</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Chính sách
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Điều khoản</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Trở thành Host
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Đăng ký Host</a></li>
                    </ul>
                </li>

            </ul>

            <div class="d-flex">
                <a href="#" class="auth-link">Đăng nhập</a>
                <a href="#" class="auth-link">Đăng ký</a>
            </div>

        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
