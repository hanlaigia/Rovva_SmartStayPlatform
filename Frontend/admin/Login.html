<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartStay Admin Portal - Đăng nhập Hệ thống</title>
  <meta name="description" content="Trang đăng nhập bảo mật dành riêng cho Quản trị viên hệ thống SmartStay Platform (Rovva).">

  <!-- Preload fonts to avoid layout shift -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-body admin-login-page">

  <!-- HEADER -->
  <header class="login-header">
    <div class="login-header-left">
      <a href="#" class="login-logo-svg-text">Rovva</a>
      <span class="login-portal-badge">Cổng Quản Trị</span>
    </div>


  </header>

  <!-- HERO SECTION -->
  <main class="login-hero">
    <div class="login-hero-container">

      <!-- Centered Login Card -->
      <div class="login-card">
        <div class="login-card-logo">Rovva</div>
        <h2 class="login-card-title">Cổng Quản Trị Hệ Thống</h2>

        <!-- Error Alert Panel -->
        <div id="error-alert" class="login-error-alert" role="alert">
          Email hoặc mật khẩu không hợp lệ.
        </div>

        <form id="login-form">
          <!-- Email Input -->
          <div class="form-group">
            <label for="email" class="form-label">Email quản trị</label>
            <input type="email" id="email" class="form-input" placeholder="admin@gmail.com" required autocomplete="email">
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password" class="form-label">Mật khẩu</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Hiển thị/ẩn mật khẩu">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me & Forgot Password -->
          <div class="login-card-options">
            <label class="login-remember-me">
              <input type="checkbox" id="remember-me">
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="login-forgot-link">Trợ giúp?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="login-submit-btn">Đăng Nhập Hệ Thống</button>
        </form>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="login-footer login-footer-admin">
    <div class="login-footer-container login-footer-admin-inner">
      <div class="login-footer-admin-text">
        <div>Công ty TNHH Rovva Việt Nam — Cổng thông tin quản trị bảo mật SmartStay Platform</div>
        <div>Copyright © 2026 Rovva. Bảo lưu mọi quyền.</div>
      </div>
    </div>
  </footer>

  <!-- DYNAMIC LOGIN LOGIC -->
  <script>
    // Redirect Guard: Check if already logged in
    if (localStorage.getItem('admin_logged_in') === 'true') {
      window.location.href = 'Main.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Password Visibility Toggle
      const passwordInput = document.getElementById('password');
      const passwordToggleBtn = document.getElementById('password-toggle');
      const eyeIcon = document.getElementById('eye-icon');

      passwordToggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Toggle eye icon
        if (type === 'text') {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          `;
        }
      });

      // 2. Login Validation Logic
      const loginForm = document.getElementById('login-form');
      const errorAlert = document.getElementById('error-alert');
      const emailInput = document.getElementById('email');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        // Custom validation strictly for admin@gmail.com and password 123
        if (email === 'admin@gmail.com' && password === '123') {
          errorAlert.style.display = 'none';
          
          // Save credentials in LocalStorage
          localStorage.setItem('admin_logged_in', 'true');
          localStorage.setItem('admin_email', 'admin@gmail.com');
          localStorage.setItem('admin_name', 'Nguyễn Admin');
          localStorage.setItem('admin_role', 'Super Admin');
          localStorage.setItem('show_welcome_toast', 'true');
          
          // Success alert and redirect
          alert(`Đăng nhập thành công! Chào mừng Nguyễn Admin quay trở lại.`);
          window.location.href = 'Main.html';
        } else {
          // Show error message
          errorAlert.textContent = 'Email hoặc mật khẩu quản trị hệ thống không chính xác!';
          errorAlert.style.display = 'block';
          
          // Reset password field
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    });
  </script>
</body>

</html>
